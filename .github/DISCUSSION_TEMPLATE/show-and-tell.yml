body:
  - type: markdown
    attributes:
      value: |
        # Please go to khulnasoft Community
        > [!IMPORTANT]
        > **New Discussions in this repo are no longer actively monitored and will be automatically closed.**
        > **Please join us at [community.khulnasoft.com/ai-toolkit](https://community.khulnasoft.com/ai-toolkit).**
  - type: checkboxes
    attributes:
      label: Acknowledgement
      options:
        - label: I acknowledge that this discussion will be automatically closed.
          required: true
  - type: textarea
    attributes:
      label: Post
    validations:
      required: true
